# Push a tag like v1.0.0 → builds the app and attaches Video1Cam-x.y.z.zip to a GitHub Release.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build, test, package
        run: ./scripts/package.sh
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "Video1Cam $GITHUB_REF_NAME" \
            --notes "Téléchargez **Video1Cam-*.zip** ci-dessous, puis suivez la section *Installation* du README."
      - name: Upload artifact (manual runs)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: Video1Cam
          path: dist/*.zip
