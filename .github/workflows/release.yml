# Push a tag like v1.0.0 → builds the app and attaches Video1Cam-x.y.z.zip to a GitHub Release.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Build, test, package
        run: ./scripts/package.sh
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub's API sometimes answers HTTP 500 while uploading: retry, reusing a release left half-created.
          for attempt in 1 2 3; do
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber &&
                gh release edit "$GITHUB_REF_NAME" --draft=false && exit 0
            else
              gh release create "$GITHUB_REF_NAME" dist/*.zip \
                --title "Video1Cam $GITHUB_REF_NAME" \
                --notes "Téléchargez **Video1Cam-*.zip** ci-dessous, puis suivez la section *Installation* du README." && exit 0
            fi
            echo "Tentative $attempt échouée, nouvel essai dans 20 s…"
            sleep 20
          done
          exit 1
      - name: Upload artifact (manual runs)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: Video1Cam
          path: dist/*.zip
